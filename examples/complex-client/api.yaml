openapi: "3.0.0"

info:
  version: 1.0.0
  title: Craft Beer API

paths:
  /beers:
    get:
      summary: List all beers
      operationId: listBeers
      responses:
        '200':
          description: List of beers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Beer'

    post:
      summary: Create a new beer
      operationId: createBeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerCreate'
          text/plain:
            schema:
              type: string
              example: "Midnight Hops,Imperial IPA,8.5,70,Northern Trail Brewing"
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BeerCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BeerCreate'

      responses:
        '201':
          description: Beer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'

        '400':
          $ref: '#/components/responses/BadRequest'

        '409':
          $ref: '#/components/responses/Conflict'

        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /beers/{beerId}:
    parameters:
      - name: beerId
        in: path
        required: true
        schema:
          type: integer
          example: 7

    get:
      summary: Get a beer by ID
      operationId: getBeer
      responses:
        '200':
          description: Beer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'

        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Replace a beer
      operationId: replaceBeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerReplace'
      responses:
        '200':
          description: Beer replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'

        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

    patch:
      summary: Partially update a beer
      operationId: updateBeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerUpdate'
      responses:
        '200':
          description: Beer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'

        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

    delete:
      summary: Delete a beer
      operationId: deleteBeer
      responses:
        '204':
          description: Beer deleted

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'

components:
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: The requested beer was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnsupportedMediaType:
      description: The request content type is not supported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Beer:
      type: object
      required:
        - id
        - name
        - style
        - abv
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          example: Midnight Hops
        style:
          type: string
          example: Imperial IPA
        abv:
          type: number
          format: float
          example: 8.5
        ibu:
          type: integer
          example: 70
        brewery:
          type: string
          example: Northern Trail Brewing

    BeerCreate:
      type: object
      required:
        - name
        - style
        - abv
      properties:
        name:
          type: string
          example: Midnight Hops
        style:
          type: string
          example: Imperial IPA
        abv:
          type: number
          format: float
          example: 8.5
        ibu:
          type: integer
          example: 70
        brewery:
          type: string
          example: Northern Trail Brewing

    BeerReplace:
      type: object
      required:
        - name
        - style
        - abv
      properties:
        name:
          type: string
          example: Midnight Hops Reserve
        style:
          type: string
          example: Double IPA
        abv:
          type: number
          format: float
          example: 9.2
        ibu:
          type: integer
          example: 85
        brewery:
          type: string
          example: Northern Trail Brewing

    BeerUpdate:
      type: object
      properties:
        name:
          type: string
          example: Midnight Hops Reserve
        style:
          type: string
          example: Double IPA
        abv:
          type: number
          format: float
          example: 9.2
        ibu:
          type: integer
          example: 85
        brewery:
          type: string
          example: Northern Trail Brewing

    Error:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Beer with id 7 was not found
