openapi: 3.1.2

info:
  title: Simple Users API
  version: 1.0.0
  description: A simple CRUD API for managing users.

servers:
  - url: http://localhost:3000

paths:
  /users:
    get:
      summary: Get all users
      operationId: getUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get a user by ID
      operationId: getUserById
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    put:
      summary: Update a user's name
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    patch:
      summary: Partially update a user
      operationId: patchUser
      description: Update the name, email, or both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserInput'
      responses:
        '200':
          description: User partially updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid update payload
        '404':
          description: User not found

    delete:
      summary: Delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John
        email:
          type: string
          format: email
          example: john@example.com

    CreateUserInput:
      type: object
      additionalProperties: false
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: John
        email:
          type: string
          format: email
          example: john@example.com

    UpdateUserInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          example: Johnny

    PatchUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          example: Johnny
        email:
          type: string
          format: email
          example: johnny@example.com
