openapi: "3.2.1"
info:
  version: 1.0.0
  title: Minimal ping API server
paths:
  /ping:
    get:
      operationId: ping
      security:
        - oauth2Auth: [ ]
      responses:
        '200':
          description: pong response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
        '401':
          description: Unauthorized

  /heartbeat:
    get:
      operationId: heartbeat
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
components:
  securitySchemes:
    oauth2Auth:
      type: oauth2
      description: OAuth 2.0 authentication using the Password Grant flow.
      flows:
        password:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            api.read: Read API resources
            api.write: Write API resources

    basicAuth:
      type: http
      scheme: basic

    bearerAuth:
      type: http
      scheme: bearer

    apiKeyAuth:
      type: apiKey
      in: query
      name: X-API-Key

  schemas:
    # base types
    Pong:
      type: object
      required:
        - ping
      properties:
        ping:
          type: string
          example: pong
