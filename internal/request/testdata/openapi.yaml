openapi: 3.0.3
info:
  title: Request Test
  version: 1.0.0

paths:
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        x-max-body-size: 5MiB
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        "200":
          description: OK

  /optional:
    post:
      operationId: createOptionalItem
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: OK

  /upload:
    post:
      operationId: uploadFile
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: OK
